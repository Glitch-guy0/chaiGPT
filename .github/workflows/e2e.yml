name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Start Docker Compose stack
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.e2e.yml up --build -d

      - name: Wait for Postgres health
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T db pg_isready -U postgres -d chaiGPT_e2e && break
            sleep 2
          done

      - name: Wait for app readiness
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 5
          done

      - name: Run smoke tests
        run: npx playwright test --config=e2e/playwright.config.ts --grep @smoke
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_E2E_EMAIL: ${{ secrets.CLERK_E2E_EMAIL }}
          CLERK_E2E_PASSWORD: ${{ secrets.CLERK_E2E_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - name: Run full e2e suite
        if: success()
        run: npx playwright test --config=e2e/playwright.config.ts
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_E2E_EMAIL: ${{ secrets.CLERK_E2E_EMAIL }}
          CLERK_E2E_PASSWORD: ${{ secrets.CLERK_E2E_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Teardown
        if: always()
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.e2e.yml down -v
