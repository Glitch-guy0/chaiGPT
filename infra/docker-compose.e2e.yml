services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chaiGPT_e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chaiGPT_e2e"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - chaigpt_net

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && echo -e \"GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"healthz check passed\"'"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - chaigpt_net

  app:
    build:
      context: ..
      dockerfile: ./Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: chaiGPT_e2e
      DB_USER: postgres
      DB_PASSWORD: postgres
      QDRANT_URL: http://qdrant:6333
      NEXTAUTH_SECRET: e2e-test-secret-not-used-for-clerk
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JINA_API_KEY: ${JINA_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - chaigpt_assets:/app/assets
    networks:
      - chaigpt_net

volumes:
  chaigpt_assets:

networks:
  chaigpt_net:
